[package]
name = "biomusic"
version = "0.1.0"
edition = "2024"
authors = ["BioTomateDE <rust@biotomate.dev>"]
license = "GPL-3.0-only"

[profile.dev.package.'*']
opt-level = 3

[lints.rust]
unused_results = "warn"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
# pedantic = { level = "warn", priority = -1 }
option_if_let_else = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
id3 = "1.17.2"
iso639-1 = { version = "0.4.1", features = ["serde"] }
mp3lame-encoder = "0.3.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["mp3"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
url = "2.5.8"
which = "8.0.6"
